<div class="top">
    <div class="title">2048</div>
    <div class="score"><small>SCORE</small><b id="sc" style="position:relative">0</b></div>
    <div class="score"><small>BEST</small><b id="best">0</b></div>
  </div>
  <div class="bar">
    <div class="sizes">Board <button class="btn sm" data-act="size" data-n="4" type="button">4×4</button><button class="btn sm" data-act="size" data-n="5" type="button">5×5</button><button class="btn sm" data-act="size" data-n="6" type="button">6×6</button></div>
    <div><button class="btn sm" id="undo" data-act="undo" type="button">↶ Undo</button> <button class="btn sm primary" id="new" data-act="new" type="button">New game</button></div>
  </div>
  <div id="board" tabindex="0" aria-label="2048 board">
    <div id="grid"></div><div id="tiles"></div>
    <div class="ov" id="ovWin"><h3>You made 2048!</h3><p>Keep going for a bigger tile?</p><div><button class="btn primary" id="keep" data-act="keep" type="button">Keep playing</button> <button class="btn" id="newW" data-act="new" type="button">New game</button></div></div>
    <div class="ov" id="ovLose"><h3>Game over</h3><p id="loseTxt"></p><div><button class="btn primary" id="newL" data-act="new" type="button">Try again</button></div></div>
  </div>
  <p class="hint">Arrow keys or W A S D to slide. On a phone, swipe on the board. Tiles with the same number merge into one.</p>
