<script>
  /* Typewriter: types out everything inside #typewriter, character by character, keeping the real links.
     Speed: change CHAR_MS (smaller = faster). If JavaScript is off, the text just shows normally. */
  function startTyping() {
    var CHAR_MS = 30;
    var box = document.getElementById("typewriter");
    if (!box) return;   // (no "reduce motion" check on purpose: Windows with animations switched off would hide the effect)
    box.style.minHeight = box.offsetHeight + "px";           // keep the space so the page doesn't jump
    var nodes = [], walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT, null), n;
    while ((n = walker.nextNode())) { if (n.nodeValue.trim()) nodes.push({ node: n, text: n.nodeValue }); }
    nodes.forEach(function (o) { o.node.nodeValue = ""; });
    var cursor = document.createElement("span"); cursor.textContent = "▌"; cursor.setAttribute("aria-hidden", "true");
    cursor.style.cssText = "color:var(--accent);animation:twblink 1s steps(1) infinite";
    var st = document.createElement("style"); st.textContent = "@keyframes twblink{50%{opacity:0}}"; document.head.appendChild(st);
    var i = 0, c = 0;
    var timer = setInterval(function () {
      if (i >= nodes.length) { clearInterval(timer); cursor.remove(); return; }
      var o = nodes[i]; c++; o.node.nodeValue = o.text.slice(0, c);
      o.node.parentNode.insertBefore(cursor, o.node.nextSibling);
      if (c >= o.text.length) { i++; c = 0; }
    }, CHAR_MS);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", startTyping); else startTyping();
</script>
