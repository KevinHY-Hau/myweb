<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chapter 11 · Sudoku</title>
<link rel="stylesheet" href="../style.css">
<style>

/* Fallback copy of the site variables, so the page still looks right without ../style.css */
:root{
  --bg:#0d1117; --fg:#e6edf3; --accent:#f59e0b; --accent-light:#fbbf24; --border:#181C22;
  --font:"Inter","Segoe UI",sans-serif;
  --text:var(--fg); --panel:rgba(255,255,255,.05); --panel2:rgba(255,255,255,.08);
  --muted:#8b98a9; --line:rgba(255,255,255,.1); --shadow:0 4px 20px rgba(0,0,0,.2);
  --good:#22c55e; --bad:#ef4444;
  --cellbg:#161b22; --peer:rgba(255,255,255,.05); --same:rgba(255,255,255,.14); --selbg:rgba(255,255,255,.1); --hu:rgba(245,158,11,.14); --hk:rgba(245,158,11,.35); --numfont:"Inter","Segoe UI",sans-serif;
}
:root[data-theme="light"]{
  --bg:#f6f8fa; --fg:#1f2328; --accent-light:#b45309; --border:#d8dee4;
  --panel:rgba(0,0,0,.035); --panel2:rgba(0,0,0,.07); --muted:#59636e; --line:rgba(0,0,0,.13);
  --shadow:0 4px 20px rgba(20,40,80,.12); --good:#15803d; --bad:#dc2626;
  --cellbg:#fff; --peer:rgba(0,0,0,.045); --same:rgba(0,0,0,.12); --selbg:rgba(0,0,0,.08); --hu:rgba(180,83,9,.12); --hk:rgba(180,83,9,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.6;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:2rem;transition:background .25s,color .25s}
@media(max-width:600px){body{padding:1rem}}
header{text-align:center;margin-bottom:1.5rem}
header h1{font-size:2.4rem;color:var(--accent);margin-bottom:.25rem}
header h2.ch{font-size:1.6rem;color:var(--accent);margin-bottom:.25rem}
header p{color:var(--accent-light);font-weight:500}
.tools{margin-top:.8rem}
main{width:100%;max-width:1320px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:1.5rem;box-shadow:var(--shadow);text-align:left}
@media(max-width:600px){main{padding:.8rem}}
footer{width:100%;max-width:1320px;margin-top:auto;padding:1.5rem 0 0;font-size:.9rem;color:var(--muted);border-top:1px solid var(--border);text-align:center}
.copyright{font-size:.8rem;opacity:.7;margin:.5rem 0}
footer details.lic{max-width:720px;margin:.3rem auto;text-align:left;border:0}
footer details.lic summary{justify-content:center;font-weight:400;font-size:.8rem;color:var(--muted)}
footer details.lic pre{white-space:pre-wrap;font:11px/1.4 ui-monospace,monospace;color:var(--muted);padding:6px 10px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
@media(max-width:1020px){.layout{grid-template-columns:1fr}}
.game{min-width:0}
.btn{appearance:none;display:inline-block;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:.6rem 1.1rem;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;transition:.2s;text-decoration:none}
.btn:hover{background:var(--panel);color:var(--fg);transform:translateY(-2px)}
.btn:active{transform:none}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.primary{background:var(--accent);color:#000;border-color:transparent}
.btn.primary:hover{background:var(--accent-light);color:#000}
.btn.sm{padding:.35rem .7rem;font-size:14px}


/* ---- board ---- */
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 auto 10px}
.stats div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px 12px;font-size:12px;color:var(--muted);text-align:center;min-width:76px}
.stats b{display:block;color:var(--fg);font-size:17px;line-height:1.25;font-variant-numeric:tabular-nums}
.stats .bad b{color:var(--bad)}
.boardwrap{margin:0 auto;width:calc(min(100%,70vh,580px)*var(--sz,1));position:relative;container-type:inline-size;user-select:none;-webkit-user-select:none}
.board{display:grid;grid-template-columns:repeat(9,1fr);border:3px solid var(--fg);border-radius:6px;overflow:hidden;background:var(--cellbg);aspect-ratio:1;box-shadow:var(--shadow)}
.board.paused .cell>*{visibility:hidden}
.cell{position:relative;appearance:none;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--cellbg);color:var(--fg);padding:0;margin:0;min-width:0;display:grid;place-items:center;cursor:pointer;font-family:var(--numfont);transition:background .12s;-webkit-tap-highlight-color:transparent;border-radius:0}
.cell.cr{border-right:3px solid var(--fg)} .cell.cb{border-bottom:3px solid var(--fg)}
.cell:nth-child(9n){border-right:0} .cell:nth-child(n+73){border-bottom:0}
.cell .v{font-size:calc(100cqw/9*.58);font-weight:300;line-height:1;pointer-events:none}
.cell.given .v{font-weight:400}
.cell:not(.given) .v{color:var(--accent-light)}
.cell .nt{position:absolute;inset:3%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);pointer-events:none;font-size:calc(100cqw/9*.22);color:var(--muted);text-align:center;line-height:1;font-weight:600}
.cell .nt i{font-style:normal;display:grid;place-items:center}
.cell .nt i.hit{color:var(--accent);font-weight:800}
.cell.pk{background:var(--peer)} .cell.sd{background:var(--same)}
.cell.sel{background:var(--selbg);box-shadow:inset 0 0 0 3px var(--accent)}
.cell.bad .v{color:var(--bad)!important} .cell.bad{background:rgba(239,68,68,.16)}
.cell.hu{background:var(--hu)} .cell.hk{background:var(--hk);box-shadow:inset 0 0 0 3px var(--accent)}
.cell:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.cell.pop .v{animation:pop .22s}
@keyframes pop{40%{transform:scale(1.35)}}
.noanim .cell,.noanim .cell.pop .v{transition:none;animation:none}
.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(10,14,24,.92);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:16px 22px;text-align:center;z-index:4;max-width:92%;width:max-content;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.banner b{display:block;font-size:1.5rem;color:#ffd84d;margin-bottom:2px}
.banner small{display:block;color:#c9d1d9;margin-top:4px}
.banner .bb{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.banner.hide{display:none}
.pad{margin:12px auto 0;width:calc(min(100%,70vh,580px)*var(--sz,1));display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.pad button{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:9px;font:700 clamp(16px,4.6vw,24px)/1 var(--numfont);padding:8px 0 6px;cursor:pointer;position:relative;transition:.15s}
.pad button:hover{background:var(--panel)} .pad button:active{transform:scale(.94)}
.pad button small{display:block;font:600 10px/1.2 var(--font);color:var(--muted);margin-top:2px;min-height:12px}
.pad button.on{outline:2px solid var(--accent)}
.pad button.done{opacity:.3}
.ctrls{margin:10px auto 0;width:calc(min(100%,70vh,580px)*var(--sz,1));display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ctrls .btn.on{background:var(--accent);color:#000}
.msg{margin:10px auto 0;width:calc(min(100%,70vh,580px)*var(--sz,1));min-height:48px;padding:8px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:14px}
.msg.good{border-color:var(--good)} .msg.bad{border-color:var(--bad)} .msg.hint{border-color:var(--accent)}
.how{font-size:13px;color:var(--muted);line-height:1.55} .how b{color:var(--fg)}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.lvls button{border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:inherit;font-size:13px;font-weight:700;padding:7px 4px 5px;border-radius:9px;cursor:pointer;line-height:1.25}
.lvls button small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.lvls button.on{background:var(--accent);color:#000;border-color:transparent} .lvls button.on small{color:#222}
textarea.cu{width:100%;min-height:60px;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:12px/1.3 ui-monospace,monospace;resize:vertical}
.steps{max-height:200px;overflow:auto;font-size:12px;color:var(--muted);background:var(--panel2);border-radius:8px;padding:6px 10px;margin-top:8px}
.steps div{padding:2px 0;border-bottom:1px solid var(--line)} .steps b{color:var(--accent-light)}
/* ---- side panels ---- */
.side{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h2{margin:0 0 10px;font-size:1.1rem;color:var(--accent)}
.tabs{display:flex;background:var(--panel2);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;padding:7px 4px;border-radius:8px;cursor:pointer}
.tabs button.on{background:var(--accent);color:#000}
.cat{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.cat button{border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:inherit;font-size:13px;padding:4px 9px;border-radius:999px;cursor:pointer}
.cat button.on{background:var(--accent);color:#000;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px;max-height:190px;overflow:auto;padding:2px}
.grid button{border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:inherit;font-size:13px;padding:5px 0;border-radius:7px;cursor:pointer;position:relative}
.grid button.on{outline:2px solid var(--accent)}
.grid button.done{background:rgba(34,197,94,.22);border-color:var(--good)}
.grid button.done::after{content:"✓";position:absolute;right:2px;top:-1px;font-size:10px;color:var(--good)}
.list{display:flex;flex-direction:column;gap:5px;max-height:230px;overflow:auto}
.list button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;cursor:pointer}
.list button.on{outline:2px solid var(--accent)} .list button.done{border-color:var(--good)}
.list small{color:var(--muted);white-space:nowrap}
.info{font-size:13px;color:var(--muted);margin:6px 2px}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.stat div{background:var(--panel2);border-radius:8px;padding:3px 10px;font-size:12px;color:var(--muted)} .stat b{color:var(--fg);font-size:14px}
.moves{max-height:150px;overflow:auto;font-size:14px;line-height:1.7;padding:6px 8px;border-radius:8px;background:var(--panel2);margin-top:8px}
.moves span.n{color:var(--muted);margin-right:3px} .moves span.m{margin-right:10px;white-space:nowrap}
.moves .cur{color:var(--accent-light);font-weight:700}
details{border-top:1px solid var(--line);padding:2px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:700;padding:10px 2px;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";color:var(--muted)}
details[open] summary::after{content:"▴"}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px}
.row.stack{flex-direction:column;align-items:stretch;gap:4px}
.row .lab{display:flex;flex-direction:column;min-width:0}
.row .lab small{color:var(--muted);font-size:12px}
.row .head{display:flex;justify-content:space-between;gap:8px}
.row output{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.sw{appearance:none;width:44px;height:26px;border-radius:999px;border:0;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:#fff}
input[type=range]{width:100%;accent-color:var(--accent)}
select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;max-width:190px}
.foot{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.note{color:var(--muted);font-size:13px;padding:4px 2px 8px}

</style>
</head>

<header>
  <h1>Kevin HY Hau - Hello World 👋 </h1><br>
  <h2 class="ch">Sudoku</h2>

  <div class="layout">
